name: Build static Linux ARM64 binary

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Static build (linux/arm64)
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binary
        run: |
          mkdir -p dist
          go env
          go build \
            -trimpath \
            -ldflags "-s -w" \
            -gcflags "-l" \
            -o dist/openp2p-linux-arm64 \
            ./cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openp2p-linux-arm64
          path: dist/openp2p-linux-arm64
          if-no-files-found: error
